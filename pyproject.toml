[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jobwatch"
version = "0.3.20"
description = "Evidence-backed job tracking across configured employer career sites"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["lxml>=5"]

[project.optional-dependencies]
browser = ["playwright>=1.51"]

[project.scripts]
jobwatch = "jobwatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobwatch = ["demo_data/*.json"]
